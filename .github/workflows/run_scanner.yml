name: Bull Put Spread Scanner

on:
  schedule:
    # כל רבע שעה מ-16:00 עד 22:45 שעון ישראל (14:00 עד 20:45 UTC) בימים שני-שישי
    - cron: '*/15 14-20 * * 1-5'
    # ריצה אחרונה ב-23:00 שעון ישראל (21:00 UTC)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests google-genai

      - name: Run Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
